services:
  app:
    image: php-dev-exercise-app:php8.4.13
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      DEBUG: ${CAKE_DEBUG:-true}
      SECURITY_SALT: ${SECURITY_SALT:?Run scripts/setup.sh first}
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE:-cakephp}
      DB_USERNAME: ${MYSQL_USER:-cakephp}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  db:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cakephp}
      MYSQL_USER: ${MYSQL_USER:-cakephp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/setup.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql_data:
